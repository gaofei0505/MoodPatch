<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MoodPatch · 灵感手账空间</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Passion+One:wght@400;700;900&family=Bungee&family=Permanent+Marker&display=swap" rel="stylesheet">
<style>
/* ── Design Tokens ─────────────────────────────────────── */
:root {
  --bg:       #f5f5f0;
  --card:     #ffffff;
  --sidebar:  #f8f8f5;
  --primary:  #ff3366;
  --secondary:#00b4d8;
  --accent:   #ffd60a;
  --dark:     #1a1a1a;
  --muted:    #e8e8e3;
  --muted-fg: #6b6b6b;
  --border:   rgba(26,26,26,0.2);
  --shadow:   4px 4px 0 0 #000;
  --shadow-lg:8px 8px 0 0 #000;
  --shadow-xl:12px 12px 0 0 #000;
  --font-tag:    'Bangers', cursive;
  --font-impact: 'Passion One', cursive;
  --font-block:  'Bungee', cursive;
  --font-graffiti: 'Permanent Marker', cursive;
}

/* ── Reset ─────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  font-weight: 500;
  color: var(--dark);
  min-height: 100vh;
  overflow-x: hidden;
}
h1 { font-family: var(--font-tag); letter-spacing: .05em; text-transform: uppercase; }
h2, h3 { font-family: var(--font-impact); letter-spacing: .02em; text-transform: uppercase; }
button { font-family: var(--font-block); letter-spacing: .02em; text-transform: uppercase; cursor: pointer; border: none; }

/* ── Header ────────────────────────────────────────────── */
#header {
  position: sticky; top: 0; z-index: 50;
  display: flex; align-items: center; gap: 16px;
  padding: 20px 32px;
  background: var(--card);
  border-bottom: 4px solid #000;
  box-shadow: 0 4px 0 0 #000;
  overflow: hidden;
}
#header .logo-wrap { flex: 1; position: relative; z-index: 10; }
#header h1 {
  font-size: 2.5rem;
  color: var(--primary);
  text-shadow: 3px 3px 0 #000, 4px 4px 0 var(--secondary);
  transform: rotate(-2deg);
  display: inline-block;
}
#header .tagline {
  font-family: var(--font-impact);
  font-size: 11px;
  color: var(--dark);
  letter-spacing: .1em;
  margin-top: 2px;
  display: block;
  transform: rotate(-1deg);
}
#header .btn-group { display: flex; gap: 12px; position: relative; z-index: 10; }

/* ── Buttons ───────────────────────────────────────────── */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 10px 20px; font-size: 13px;
  border: 4px solid #000;
  transition: all .15s;
}
.btn:hover { transform: translate(2px, 2px); }
.btn-primary {
  background: var(--primary); color: #fff;
  box-shadow: var(--shadow);
}
.btn-primary:hover { box-shadow: 2px 2px 0 0 #000; background: #e8002e; }
.btn-outline {
  background: var(--card); color: var(--dark);
  box-shadow: var(--shadow);
}
.btn-outline:hover { box-shadow: 2px 2px 0 0 #000; background: var(--accent); }
.btn-accent {
  background: var(--accent); color: var(--dark);
  box-shadow: var(--shadow);
}
.btn-accent:hover { box-shadow: 2px 2px 0 0 #000; background: var(--secondary); color: #fff; }
.btn-secondary {
  background: var(--secondary); color: #fff;
  box-shadow: var(--shadow);
}
.btn:disabled { opacity: .4; cursor: not-allowed; transform: none !important; pointer-events: none; }

/* ── Decorations ───────────────────────────────────────── */
.splat {
  position: absolute; pointer-events: none;
  width: 80px; height: 80px; opacity: .18;
}
.tape {
  position: absolute; pointer-events: none;
  width: 60px; height: 22px; opacity: .7;
  background: rgba(255,212,10,.55);
  border: 2px solid rgba(0,0,0,.25);
  transform: rotate(3deg);
}

/* ── INSPIRATION Section ───────────────────────────────── */
#inspiration {
  position: relative;
  padding: 80px 48px;
  background: linear-gradient(to bottom, var(--bg), var(--muted));
  overflow: hidden;
}
.insp-title {
  font-size: 4rem;
  color: var(--primary);
  text-shadow: 4px 4px 0 #000, 5px 5px 0 var(--accent);
  transform: rotate(-2deg);
  display: inline-block;
  margin-bottom: 16px;
}
.insp-subtitle {
  font-size: 1rem; font-weight: 700; text-transform: uppercase;
  letter-spacing: .1em; color: var(--dark);
  display: flex; align-items: center; gap: 8px;
  justify-content: center;
}
.insp-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 64px;
  align-items: center; margin-top: 64px;
  max-width: 900px; margin-left: auto; margin-right: auto;
}
.insp-card {
  position: relative;
  transform: rotate(-2deg);
  transition: transform .5s ease;
}
.insp-card:hover { transform: rotate(0deg); }
.insp-card .glow {
  position: absolute; inset: -16px;
  background: rgba(255,51,102,.2);
  filter: blur(40px); pointer-events: none;
}
.insp-card .photo-frame {
  position: relative;
  border: 8px solid #fff;
  box-shadow: var(--shadow-xl);
  transition: all .3s;
  overflow: hidden;
}
.insp-card:hover .photo-frame {
  box-shadow: 6px 6px 0 0 #000;
  transform: translate(6px, 6px);
}
.insp-card img { display: block; width: 100%; height: 420px; object-fit: cover; object-position: center top; }
.insp-card.right { transform: rotate(3deg); margin-top: 80px; }
.insp-card.right:hover { transform: rotate(1deg); }
.insp-card.right .glow { background: rgba(0,180,216,.2); }
.insp-footer {
  text-align: center; margin-top: 80px;
  font-family: var(--font-graffiti); font-size: 1.6rem; color: var(--dark);
  transform: rotate(1deg);
}
.scroll-down-hint {
  text-align: center; margin-top: 24px;
  font-family: var(--font-block); font-size: .75rem;
  color: var(--muted-fg); letter-spacing: .1em;
}

/* ── WORKSPACE Section ─────────────────────────────────── */
#workspace {
  padding: 48px 32px;
  min-height: 100vh;
}
.ws-title-wrap { text-align: center; margin-bottom: 32px; }
.ws-title {
  font-size: 2.5rem;
  color: var(--secondary);
  text-shadow: 3px 3px 0 #000;
  transform: rotate(-1deg);
  display: inline-block;
}
.ws-sub {
  font-size: .75rem; font-weight: 700;
  text-transform: uppercase; letter-spacing: .1em;
  color: var(--muted-fg); margin-top: 8px;
}
.ws-layout { display: flex; gap: 32px; align-items: flex-start; max-width: 1280px; margin: 0 auto; }

/* ── Sidebar ───────────────────────────────────────────── */
#sidebar {
  width: 320px; flex-shrink: 0;
  position: sticky; top: 88px;
  border: 4px solid #000;
  box-shadow: var(--shadow-lg);
  background: var(--sidebar);
}

/* Upload Zone */
#upload-zone {
  padding: 24px;
  position: relative;
}
.drop-area {
  padding: 48px 24px;
  border: 4px dashed #000;
  background: var(--card);
  cursor: pointer;
  text-align: center;
  transition: all .3s;
  position: relative;
  overflow: hidden;
  box-shadow: var(--shadow-lg);
}
.drop-area:hover {
  background: rgba(255,212,10,.1);
  box-shadow: 4px 4px 0 0 #000;
  transform: translate(4px, 4px);
}
.drop-area .camera-box {
  width: 80px; height: 80px; margin: 0 auto 24px;
  background: linear-gradient(135deg, var(--primary), var(--secondary));
  border: 4px solid #000; box-shadow: var(--shadow);
  display: flex; align-items: center; justify-content: center;
  transform: rotate(3deg);
  transition: transform .3s;
}
.drop-area:hover .camera-box { transform: rotate(6deg); }
.drop-area h3 {
  font-size: 2rem;
  color: var(--primary);
  text-shadow: 3px 3px 0 #000, 4px 4px 0 var(--accent);
  margin-bottom: 8px;
  transform: rotate(-1deg);
  display: block;
}
.drop-area p {
  font-size: .75rem; font-weight: 700; text-transform: uppercase;
  color: var(--dark); margin-bottom: 16px;
}
#file-input { display: none; }

/* Materials Panel */
#materials-panel { display: none; }
.mat-header {
  padding: 16px;
  border-bottom: 4px solid #000;
  background: rgba(255,212,10,.2);
  position: relative;
}
.mat-header h2 {
  font-size: 1.25rem; color: var(--primary);
  text-shadow: 2px 2px 0 #000;
  transform: rotate(-1deg); display: inline-block;
}
.mat-count { font-size: .75rem; font-weight: 700; text-transform: uppercase; color: var(--dark); margin-top: 2px; }
.mat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 16px; max-height: 480px; overflow-y: auto; }
.mat-item {
  position: relative; cursor: move;
  border: 4px solid #000;
  background: var(--card); overflow: hidden;
  aspect-ratio: 1;
  box-shadow: 4px 4px 0 0 #000;
  transition: all .2s;
}
.mat-item:hover { box-shadow: 2px 2px 0 0 #000; transform: translate(2px, 2px); }
.mat-item img { width: 100%; height: 100%; object-fit: contain; padding: 6px; }
.mat-item .processing {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: linear-gradient(135deg, rgba(255,51,102,.1), rgba(0,180,216,.1));
}
.mat-item .spinner {
  width: 28px; height: 28px;
  border: 3px solid #000; border-top-color: var(--primary);
  border-radius: 50%; animation: spin 1s linear infinite;
  margin-bottom: 8px;
}
.mat-item .del-btn {
  position: absolute; top: -8px; right: -8px;
  width: 28px; height: 28px;
  background: #e63946; border: 3px solid #000; border-radius: 50%;
  display: none; align-items: center; justify-content: center;
  color: #fff; font-size: 12px; font-weight: bold; cursor: pointer;
  box-shadow: 2px 2px 0 0 #000;
}
.mat-item:hover .del-btn { display: flex; }
.mat-add-btn {
  width: 100%; padding: 12px;
  background: var(--accent); color: var(--dark);
  border: 4px solid #000; box-shadow: var(--shadow);
  font-size: .7rem; margin: 0; transition: all .2s;
  border-top: 4px solid #000;
}
.mat-add-btn:hover { box-shadow: 2px 2px 0 0 #000; transform: translate(2px, 2px); background: var(--secondary); color: #fff; }

/* ── Canvas Area ───────────────────────────────────────── */
#canvas-wrap {
  flex: 1;
  border: 4px solid #000;
  box-shadow: var(--shadow-xl);
  background: var(--card);
  position: relative;
  height: 800px;
  overflow: hidden;
}
#canvas-area {
  width: 100%; height: 100%;
  background: var(--bg);
  position: relative;
  overflow: hidden;
}

/* Canvas background decorations */
.canvas-dot-grid {
  position: absolute; inset: 0; pointer-events: none;
  background-image: radial-gradient(circle, rgba(26,26,26,.1) 1px, transparent 1px);
  background-size: 24px 24px;
}

/* Empty canvas placeholder */
#canvas-empty {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  pointer-events: none;
}
.empty-text {
  text-align: center; transform: rotate(-2deg);
}
.empty-icon {
  font-size: 64px; margin-bottom: 16px;
  filter: drop-shadow(4px 4px 0 rgba(0,0,0,.5));
}
.empty-label {
  font-size: 2.5rem;
  color: var(--primary);
  text-shadow: 3px 3px 0 #000, 4px 4px 0 var(--accent);
}
.empty-hint {
  font-size: .75rem; font-weight: 700; text-transform: uppercase;
  color: var(--dark); margin-top: 8px;
}

/* Canvas items */
.canvas-item {
  position: absolute;
  cursor: move; user-select: none;
}
.canvas-item img {
  width: 100%; height: 100%;
  object-fit: contain;
  pointer-events: none; display: block;
}
.canvas-item.selected .item-border {
  position: absolute; inset: 0;
  border: 4px dashed var(--primary);
  box-shadow: 0 0 0 4px rgba(255,51,102,.3);
  pointer-events: none;
}
.canvas-item .item-toolbar {
  position: absolute; top: -52px; left: 0;
  display: none;
  background: var(--card);
  border: 4px solid #000; box-shadow: var(--shadow);
  padding: 6px; gap: 6px; z-index: 100;
  white-space: nowrap;
}
.canvas-item.selected .item-toolbar { display: flex; }
.canvas-item .tool-btn {
  width: 32px; height: 32px;
  border: 3px solid #000; font-size: 13px;
  display: flex; align-items: center; justify-content: center;
  transition: all .15s; box-shadow: 2px 2px 0 0 #000;
}
.canvas-item .tool-btn:hover { box-shadow: 1px 1px 0 0 #000; transform: translate(1px,1px); }
.canvas-item .tool-btn.rotate-btn  { background: var(--secondary); color: #fff; }
.canvas-item .tool-btn.scale-up    { background: var(--secondary); color: #fff; }
.canvas-item .tool-btn.scale-down  { background: var(--secondary); color: #fff; }
.canvas-item .tool-btn.delete-btn  { background: #e63946; color: #fff; }
.canvas-item .resize-handle {
  position: absolute; bottom: -10px; right: -10px;
  width: 22px; height: 22px;
  background: var(--accent); border: 3px solid #000;
  border-radius: 50%; cursor: se-resize;
  box-shadow: 2px 2px 0 0 #000;
  z-index: 10;
  display: none;
}
.canvas-item.selected .resize-handle { display: block; }

/* Drop zone highlight */
#canvas-area.drag-over { background: rgba(255,212,10,.08); }
#canvas-area.drag-over::after {
  content: '放手添加素材';
  font-family: var(--font-tag); font-size: 2rem;
  color: var(--primary); text-shadow: 2px 2px 0 #000;
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  pointer-events: none;
  border: 4px dashed var(--primary);
}

/* ── Toast Notifications ───────────────────────────────── */
#toast-container {
  position: fixed; bottom: 24px; right: 24px;
  z-index: 9999; display: flex; flex-direction: column; gap: 8px;
}
.toast {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 16px;
  background: var(--dark); color: #fff;
  border: 3px solid #000; box-shadow: var(--shadow);
  font-size: .8rem; font-weight: 700; text-transform: uppercase;
  animation: slideIn .3s ease; min-width: 200px;
}
.toast.success { background: #1a7a4a; }
.toast.error   { background: #e63946; }
@keyframes slideIn { from { transform: translateX(120%); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes slideOut { to { transform: translateX(120%); opacity: 0; } }
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Utility ───────────────────────────────────────────── */
.text-center { text-align: center; }
.star { display: inline-block; color: var(--primary); }
.sparkle { color: var(--accent); }
</style>
</head>
<body>

<!-- HEADER                                              -->
<!-- ════════════════════════════════════════════════════ -->
<header id="header">
  <!-- Splat decorations -->
  <svg class="splat" style="top:-20px;right:80px;color:#ff3366" viewBox="0 0 100 100">
    <path d="M50,10 C70,12 88,30 90,50 C88,70 70,88 50,90 C30,88 12,70 10,50 C12,30 30,12 50,10 Z" fill="currentColor"/>
  </svg>
  <svg class="splat" style="bottom:-20px;right:180px;color:#00b4d8" viewBox="0 0 100 100">
    <path d="M50,8 C65,10 84,22 88,42 C92,62 80,82 60,90 C40,95 18,82 10,62 C4,44 12,20 30,12 C38,8 44,6 50,8 Z" fill="currentColor"/>
  </svg>
  <div style="position:absolute;top:0;right:120px" class="tape"></div>

  <div class="logo-wrap">
    <h1>MoodPatch</h1>
    <span class="tagline">灵感手账创作空间 · feigao0505@gmail.com</span>

  <div class="btn-group">
    <button class="btn btn-outline" id="btn-export-png" disabled>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      PNG
    </button>
    <button class="btn btn-primary" id="btn-export-pdf" disabled>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      PDF
    </button>
  </div>
</header>

<!-- ════════════════════════════════════════════════════ -->
<!-- INSPIRATION SECTION                                 -->
<!-- ════════════════════════════════════════════════════ -->
<section id="inspiration">
  <!-- Background splats -->
  <svg class="splat" style="top:40px;left:80px;color:#ff3366;opacity:.12" viewBox="0 0 100 100">
    <path d="M50,10 C70,12 88,30 90,50 C88,70 70,88 50,90 C30,88 12,70 10,50 C12,30 30,12 50,10 Z" fill="currentColor"/>
  </svg>
  <svg class="splat" style="bottom:80px;right:160px;color:#00b4d8;opacity:.12" viewBox="0 0 100 100">
    <path d="M50,8 C65,10 84,22 88,42 C92,62 80,82 60,90 C40,95 18,82 10,62 C4,44 12,20 30,12 C38,8 44,6 50,8 Z" fill="currentColor"/>
  </svg>
  <svg class="splat" style="top:160px;right:80px;color:#ffd60a;opacity:.08;width:120px;height:120px" viewBox="0 0 100 100">
    <path d="M50,10 C70,12 88,30 90,50 C88,70 70,88 50,90 C30,88 12,70 10,50 C12,30 30,12 50,10 Z" fill="currentColor"/>
  </svg>

  <div style="text-align:center;position:relative">
    <h2 class="insp-title">INSPIRATION</h2>
    <div class="insp-subtitle">
      <span class="star">★</span>
      手账灵感拼贴
      <span class="sparkle">✦</span>
    </div>
  </div>

  <div class="insp-grid">
    <!-- Left photo card -->
    <div class="insp-card left">
      <div class="tape" style="top:-20px;left:25%;transform:rotate(-5deg)"></div>

<script>
// ════════════════════════════════════════════════════════
// STATE
// ════════════════════════════════════════════════════════
const state = {
  materials: [],    // { id, name, originalUrl, processedUrl, isProcessing }
  canvasItems: [],  // { id, imageUrl, x, y, width, height, rotation, zIndex }
  selectedId: null,
  dragMaterial: null,
  nextZIndex: 1,
};

// Streamlit bridge (works when embedded in Streamlit component)
let streamlitMode = false;
function sendToStreamlit(type, data) {
  try {
    window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type }, data || {}), '*');
    streamlitMode = true;
  } catch(e) {}
}

// ════════════════════════════════════════════════════════
// TOAST
// ════════════════════════════════════════════════════════
function showToast(msg, type = 'success') {
  const tc = document.getElementById('toast-container');
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.textContent = msg;
  tc.appendChild(el);
  setTimeout(() => {
    el.style.animation = 'slideOut .3s ease forwards';
    setTimeout(() => el.remove(), 300);
  }, 2800);
}

// ════════════════════════════════════════════════════════
// BACKGROUND REMOVAL (client-side)
// ════════════════════════════════════════════════════════
async function removeBackground(file) {
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const W = img.width, H = img.height;
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = W; canvas.height = H;
        ctx.drawImage(img, 0, 0);

        const imageData = ctx.getImageData(0, 0, W, H);
        const data = imageData.data;

        // 从四角采样背景颜色
        const corners = [[0,0],[W-1,0],[0,H-1],[W-1,H-1],[W>>1,0],[0,H>>1],[W-1,H>>1],[W>>1,H-1]];
        let rS=0,gS=0,bS=0;
        corners.forEach(([x,y])=>{ const i=(y*W+x)*4; rS+=data[i];gS+=data[i+1];bS+=data[i+2]; });
        const bgR=rS/corners.length, bgG=gS/corners.length, bgB=bS/corners.length;

        // 判断像素是否为背景色（颜色距离）
        const TOL = 45;
        function isBg(i) {
          const r=data[i],g=data[i+1],b=data[i+2];
          return Math.sqrt((r-bgR)**2+(g-bgG)**2+(b-bgB)**2) < TOL;
        }

        // Flood-fill 从边缘出发，只去掉连通背景区域（保住主体）
        const visited = new Uint8Array(W * H);
        const queue = [];

        // 把所有边缘像素中属于背景的加入队列
        for (let x = 0; x < W; x++) {
          [[x,0],[x,H-1]].forEach(([px,py])=>{
            const idx=py*W+px;
            if(!visited[idx] && isBg(idx*4)){ visited[idx]=1; queue.push(idx); }
          });
        }
        for (let y = 1; y < H-1; y++) {
          [[0,y],[W-1,y]].forEach(([px,py])=>{
            const idx=py*W+px;
            if(!visited[idx] && isBg(idx*4)){ visited[idx]=1; queue.push(idx); }
          });
        }

        // BFS 扩散
        let head = 0;
        while (head < queue.length) {
          const cur = queue[head++];
          const x = cur % W, y = (cur / W) | 0;
          data[cur*4+3] = 0; // 透明
          const neighbors = [];
          if(x>0) neighbors.push(cur-1);
          if(x<W-1) neighbors.push(cur+1);
          if(y>0) neighbors.push(cur-W);
          if(y<H-1) neighbors.push(cur+W);
          neighbors.forEach(n=>{
            if(!visited[n] && isBg(n*4)){ visited[n]=1; queue.push(n); }
          });
        }

        ctx.putImageData(imageData, 0, 0);
        resolve(canvas.toDataURL('image/png'));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

// ════════════════════════════════════════════════════════
// UPLOAD & PROCESSING
// ════════════════════════════════════════════════════════
async function handleFiles(files) {
  const imageFiles = Array.from(files).filter(f => f.type.startsWith('image/'));
  if (!imageFiles.length) return;

  switchToMaterials();

  // Read all files as base64 and register as pending
  const pending = [];
  for (const file of imageFiles) {
    const id = `mat-${Date.now()}-${Math.random().toString(36).slice(2)}`;
    const originalUrl = URL.createObjectURL(file);
    const mat = { id, name: file.name, originalUrl, processedUrl: '', isProcessing: true };
    state.materials.push(mat);
    pending.push({ id, file });
  }
  renderMaterials();

  // Convert to base64 and send to Python rembg
  const images = await Promise.all(pending.map(({ id, file }) =>
    new Promise(resolve => {
      const reader = new FileReader();
      reader.onload = e => resolve({ id, dataUrl: e.target.result });
      reader.readAsDataURL(file);
    })
  ));

  // Send to Streamlit for rembg processing
  sendToStreamlit('streamlit:setComponentValue', {
    value: { action: 'remove_bg', images },
    dataType: 'json',
  });
}

// ════════════════════════════════════════════════════════
// MATERIALS RENDER
// ════════════════════════════════════════════════════════
function switchToMaterials() {
  document.getElementById('upload-zone').style.display = 'none';
  document.getElementById('materials-panel').style.display = 'block';
}

function renderMaterials() {
  const grid = document.getElementById('mat-grid');
  const count = document.getElementById('mat-count');
  count.textContent = `${state.materials.length} ITEMS`;
  grid.innerHTML = '';
  state.materials.forEach(mat => {
    const div = document.createElement('div');
    div.className = 'mat-item';
    div.style.transform = `rotate(${(state.materials.indexOf(mat) % 3 - 1) * 3}deg)`;
    if (!mat.isProcessing) {
      div.draggable = true;
      div.addEventListener('dragstart', (e) => {
        state.dragMaterial = mat;
        e.dataTransfer.effectAllowed = 'copy';
        e.dataTransfer.setData('text/plain', mat.id);
      });
    }
    if (mat.isProcessing) {
      div.innerHTML = `
        <div class="processing">
          <div class="spinner"></div>
          <span style="font-size:.65rem;font-weight:700;text-transform:uppercase">Processing</span>
        </div>`;
    } else {
      div.innerHTML = `
        <img src="${mat.processedUrl}" alt="${mat.name}" style="filter:contrast(1.1) saturate(1.2)">
        <button class="del-btn" onclick="deleteMaterial('${mat.id}')">×</button>`;
    }
    grid.appendChild(div);
  });
}

function deleteMaterial(id) {
  state.materials = state.materials.filter(m => m.id !== id);
  state.canvasItems = state.canvasItems.filter(i => i.materialId !== id);
  if (!state.materials.length) {
    document.getElementById('upload-zone').style.display = 'block';
    document.getElementById('materials-panel').style.display = 'none';
  }
  renderMaterials();
  renderCanvas();
}

// ════════════════════════════════════════════════════════
// CANVAS DROP
// ════════════════════════════════════════════════════════
function handleDragOver(e) {
  e.preventDefault();
  document.getElementById('canvas-area').classList.add('drag-over');
}
function handleDragLeave(e) {
  document.getElementById('canvas-area').classList.remove('drag-over');
}
function handleDrop(e) {
  e.preventDefault();
  document.getElementById('canvas-area').classList.remove('drag-over');
  const mat = state.dragMaterial;
  if (!mat || mat.isProcessing) return;
  const rect = document.getElementById('canvas-area').getBoundingClientRect();
  addCanvasItem(mat, e.clientX - rect.left - 75, e.clientY - rect.top - 75);
  state.dragMaterial = null;
}

function handleCanvasClick(e) {
  if (e.target === document.getElementById('canvas-area') ||
      e.target.classList.contains('canvas-dot-grid') ||
      e.target.tagName === 'svg' || e.target.tagName === 'path') {
    deselectAll();
  }
}

// ════════════════════════════════════════════════════════
// CANVAS ITEMS
// ════════════════════════════════════════════════════════
function addCanvasItem(mat, x, y) {
  const item = {
    id: `item-${Date.now()}-${Math.random().toString(36).slice(2)}`,
    materialId: mat.id,
    imageUrl: mat.processedUrl,
    x, y, width: 150, height: 150,
    rotation: 0,
    zIndex: state.nextZIndex++,
  };
  state.canvasItems.push(item);
  updateExportButtons();
  renderCanvas();
}

function renderCanvas() {
  const area = document.getElementById('canvas-area');
  // Remove old items (keep decorations + empty placeholder)
  area.querySelectorAll('.canvas-item').forEach(el => el.remove());

  const hasItems = state.canvasItems.length > 0;
  document.getElementById('canvas-empty').style.display = hasItems ? 'none' : 'flex';

  state.canvasItems.forEach(item => {
    const el = createCanvasItemEl(item);
    area.appendChild(el);
  });
}

function createCanvasItemEl(item) {
  const el = document.createElement('div');
  el.className = 'canvas-item' + (state.selectedId === item.id ? ' selected' : '');
  el.dataset.id = item.id;
  el.style.cssText = `
    left: ${item.x}px; top: ${item.y}px;
    width: ${item.width}px; height: ${item.height}px;
    transform: rotate(${item.rotation}deg);
    z-index: ${item.zIndex};
  `;
  el.innerHTML = `
    <div class="item-border"></div>
    <div class="item-toolbar">
      <button class="tool-btn rotate-btn" title="旋转" onclick="rotateItem('${item.id}',event)">↻</button>
      <button class="tool-btn scale-up" title="放大" onclick="scaleItem('${item.id}',1.1,event)">＋</button>
      <button class="tool-btn scale-down" title="缩小" onclick="scaleItem('${item.id}',0.9,event)">－</button>
      <button class="tool-btn delete-btn" title="删除" onclick="deleteItem('${item.id}',event)">✕</button>
    </div>
    <img src="${item.imageUrl}" alt="Canvas item" draggable="false">
    <div class="resize-handle"></div>
  `;

  // Drag to move
  let dragging = false, startX, startY, startItemX, startItemY;
  el.addEventListener('mousedown', (e) => {
    if (e.target.closest('.tool-btn') || e.target.classList.contains('resize-handle')) return;
    e.stopPropagation(); e.preventDefault();
    selectItem(item.id);
    dragging = true;
    startX = e.clientX; startY = e.clientY;
    startItemX = item.x; startItemY = item.y;
  });

  // Resize
  const resizeHandle = el.querySelector('.resize-handle');
  let resizing = false, resStartX, resStartY, resStartW, resStartH;
  resizeHandle.addEventListener('mousedown', (e) => {
    e.stopPropagation(); e.preventDefault();
    resizing = true;
    resStartX = e.clientX; resStartY = e.clientY;
    resStartW = item.width; resStartH = item.height;
  });

  // Global mouse handlers attached to window on demand
  const onMove = (e) => {
    if (dragging) {
      item.x = startItemX + (e.clientX - startX);
      item.y = startItemY + (e.clientY - startY);
      el.style.left = item.x + 'px';
      el.style.top  = item.y + 'px';
    } else if (resizing) {
      item.width  = Math.max(40, resStartW + (e.clientX - resStartX));
      item.height = Math.max(40, resStartH + (e.clientY - resStartY));
      el.style.width  = item.width  + 'px';
      el.style.height = item.height + 'px';
    }
  };
  const onUp = () => {
    dragging = false; resizing = false;
    updateExportButtons();
  };
  window.addEventListener('mousemove', onMove);
  window.addEventListener('mouseup',   onUp);

  return el;
}

function selectItem(id) {
  state.selectedId = id;
  document.querySelectorAll('.canvas-item').forEach(el => {
    el.classList.toggle('selected', el.dataset.id === id);
  });
}

function deselectAll() {
  state.selectedId = null;
  document.querySelectorAll('.canvas-item.selected').forEach(el => el.classList.remove('selected'));
}

function rotateItem(id, e) {
  e.stopPropagation();
  const item = state.canvasItems.find(i => i.id === id);
  if (!item) return;
  item.rotation = (item.rotation + 15) % 360;
  const el = document.querySelector(`[data-id="${id}"]`);
  if (el) el.style.transform = `rotate(${item.rotation}deg)`;
}

function scaleItem(id, factor, e) {
  e.stopPropagation();
  const item = state.canvasItems.find(i => i.id === id);
  if (!item) return;
  item.width  = Math.max(40, item.width  * factor);
  item.height = Math.max(40, item.height * factor);
  const el = document.querySelector(`[data-id="${id}"]`);
  if (el) { el.style.width = item.width + 'px'; el.style.height = item.height + 'px'; }
}

function deleteItem(id, e) {
  if (e) e.stopPropagation();
  state.canvasItems = state.canvasItems.filter(i => i.id !== id);
  document.querySelector(`[data-id="${id}"]`)?.remove();
  if (state.selectedId === id) state.selectedId = null;
  if (!state.canvasItems.length) document.getElementById('canvas-empty').style.display = 'flex';
  updateExportButtons();
}

function updateExportButtons() {
  const has = state.canvasItems.length > 0;
  document.getElementById('btn-export-png').disabled = !has;
  document.getElementById('btn-export-pdf').disabled = !has;
}

// ════════════════════════════════════════════════════════
// EXPORT
// ════════════════════════════════════════════════════════
async function exportToCanvas() {
  if (!state.canvasItems.length) return null;
  const items = state.canvasItems;
  const xs = items.map(i => i.x), ys = items.map(i => i.y);
  const minX = Math.min(...xs), minY = Math.min(...ys);
  const maxX = Math.max(...items.map(i => i.x + i.width));
  const maxY = Math.max(...items.map(i => i.y + i.height));
  const pad = 40;
  const W = maxX - minX + pad * 2, H = maxY - minY + pad * 2;

  const cvs = document.createElement('canvas');
  cvs.width = W; cvs.height = H;
  const ctx = cvs.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, W, H);

  const sorted = [...items].sort((a, b) => a.zIndex - b.zIndex);
  for (const item of sorted) {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    await new Promise((res, rej) => {
      img.onload = () => {
        ctx.save();
        const cx = item.x - minX + pad + item.width  / 2;
        const cy = item.y - minY + pad + item.height / 2;
        ctx.translate(cx, cy);
        ctx.rotate(item.rotation * Math.PI / 180);
        ctx.drawImage(img, -item.width / 2, -item.height / 2, item.width, item.height);
        ctx.restore();
        res();
      };
      img.onerror = rej;
      img.src = item.imageUrl;
    }).catch(() => {});
  }
  return cvs;
}

async function exportPNG() {
  const cvs = await exportToCanvas();
  if (!cvs) { showToast('画布为空，无法导出', 'error'); return; }
  cvs.toBlob(blob => {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `moodpatch-${Date.now()}.png`;
    a.click(); URL.revokeObjectURL(url);
    showToast('PNG 导出成功 ✓');
  });
}

async function exportPDF() {
  const cvs = await exportToCanvas();
  if (!cvs) { showToast('画布为空，无法导出', 'error'); return; }
  const dataUrl = cvs.toDataURL('image/jpeg', 0.92);
  const aspect = cvs.width / cvs.height;
  const pw = 595.28, ph = pw / aspect;
  const imgData = dataUrl.split(',')[1];
  const pdf = `%PDF-1.4
1 0 obj<</Type/Catalog/Pages 2 0 R>>endobj
2 0 obj<</Type/Pages/Kids[3 0 R]/Count 1>>endobj
3 0 obj<</Type/Page/Parent 2 0 R/MediaBox[0 0 ${pw.toFixed(2)} ${ph.toFixed(2)}]/Contents 4 0 R/Resources<</XObject<</Im1 5 0 R>>>>>>endobj
4 0 obj<</Length 44>>
stream
q ${pw.toFixed(2)} 0 0 ${ph.toFixed(2)} 0 0 cm /Im1 Do Q
endstream
endobj
5 0 obj<</Type/XObject/Subtype/Image/Width ${cvs.width}/Height ${cvs.height}/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length ${imgData.length}>>
stream
${imgData}
endstream
endobj
xref
0 6
0000000000 65535 f
0000000009 00000 n
0000000058 00000 n
0000000115 00000 n
0000000266 00000 n
0000000360 00000 n
trailer<</Size 6/Root 1 0 R>>
startxref
${600 + imgData.length}
%%EOF`;
  const blob = new Blob([pdf], { type: 'application/pdf' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `moodpatch-${Date.now()}.pdf`;
  a.click(); URL.revokeObjectURL(url);
  showToast('PDF 导出成功 ✓');
}

// ════════════════════════════════════════════════════════
// EVENT LISTENERS
// ════════════════════════════════════════════════════════
document.getElementById('file-input').addEventListener('change', (e) => {
  handleFiles(e.target.files);
  e.target.value = '';
});

const dropArea = document.getElementById('drop-area');
dropArea.addEventListener('dragover',  (e) => { e.preventDefault(); dropArea.style.background = 'rgba(255,212,10,.2)'; });
dropArea.addEventListener('dragleave', ()  => { dropArea.style.background = ''; });
dropArea.addEventListener('drop', (e) => {
  e.preventDefault(); dropArea.style.background = '';
  handleFiles(e.dataTransfer.files);
});
dropArea.addEventListener('click', (e) => {
  if (e.target.tagName !== 'BUTTON') document.getElementById('file-input').click();
});

document.getElementById('btn-export-png').addEventListener('click', exportPNG);
document.getElementById('btn-export-pdf').addEventListener('click', exportPDF);

// Keyboard shortcuts for selected canvas item
document.addEventListener('keydown', (e) => {
  if (!state.selectedId) return;
  if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); deleteItem(state.selectedId); }
  else if (e.key === 'r' || e.key === 'R') { e.preventDefault(); rotateItem(state.selectedId, { stopPropagation: () => {} }); }
  else if (e.key === 'Escape') deselectAll();
});

// ════════════════════════════════════════════════════════
// STREAMLIT COMPONENT BRIDGE (optional)
// ════════════════════════════════════════════════════════
sendToStreamlit('streamlit:componentReady', { apiVersion: 1 });

// Receive rembg-processed images from Python
window.addEventListener('message', (event) => {
  const d = event.data;
  if (!d || d.type !== 'streamlit:render') return;

  const args = d.args || {};
  const processed = args.processed_images || {};  // { id: dataUrl }

  // Update any matching pending materials
  let updated = false;
  state.materials.forEach(mat => {
    if (mat.isProcessing && processed[mat.id]) {
      const result = processed[mat.id];
      if (result.startsWith('error:')) {
        // Fallback: keep original on error
        mat.processedUrl = mat.originalUrl;
        mat.isProcessing = false;
        showToast('AI 抠图失败，使用原图', 'error');
      } else {
        mat.processedUrl = result;
        mat.isProcessing = false;
      }
      updated = true;
    }
  });

  if (updated) renderMaterials();

  sendToStreamlit('streamlit:setFrameHeight', { height: document.body.scrollHeight });
});
</script>
